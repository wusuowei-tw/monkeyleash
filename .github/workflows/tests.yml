# 這個檔的驗收住在 tests/test_ci_workflow.py(票 54)。
# 改這個檔之前先看那一支 —— permissions、action 釘 sha、不得碰使用者層,
# 三件都是**測試在守,不是慣例**。改壞了本機就會紅,不必等 CI。

name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 最小權限:只讀內容。本 repo 的 CI 只跑測試,不發布、不部署、不留言。
# **明寫而不是留白** —— 留白用的是 repo 預設,而預設不在這個檔案裡、改了不會有 diff。
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # 第三方 action 一律釘 40 位 commit sha,不釘標籤。
      # 標籤可以被移動,而移動不會通知任何人 —— 與 provenance 同一原理:
      # 記住那一組確切的位元組,不是記住一個會漂移的名字。
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # **必要,不是效能取捨。** 預設 fetch-depth: 1 是淺層 clone(只抓最新
          # 一筆),而 R6 要 git cat-file -e <go-live>:<path> —— go-live 是一個
          # 舊 commit,淺層下那棵樹不在這個 repo 裡。
          #
          # 後果不是「R6 沒跑」,是**R6 判九個條目全部違規,並說它們是後來手加的**。
          # fail-closed 的方向對,診斷錯:R6 分不出「路徑不在那棵樹裡」與
          # 「那棵樹不在這個 repo 裡」。第一次 CI 執行就是這樣紅的(3 條)。
          #
          # 本機永遠測不出這個 —— 本機的 clone 一直是完整的。
          # 守它的是 tests/test_ci_workflow.py::test_checkout_fetches_the_whole_history。
          fetch-depth: 0

      # v6.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          # 釘 3.11,與桌機相同。一次只變一個變數:CI 的價值是換一台
          # 乾淨機器,不是順便換直譯器版本。
          # pyproject.toml 只寫 requires-python >= 3.10(有下限無上限),
          # 那個不對稱已登記在票 54,不在這裡處理。
          python-version: '3.11'

      - name: 安裝相依
        run: python -m pip install -e ".[dev]"

      # 權威層靠 core.hooksPath 接上(.githooks/pre-commit 進版控),
      # 而那是 per-clone 的 config,clone 不會帶走 —— 每個乾淨 checkout 都要設一次。
      # 少了這一步 tests/test_gate.py::TestAuthorityLayerIsWired 會紅,
      # 而它紅得對:那時權威層真的沒接上。
      - name: 接上權威層
        run: sh bootstrap.sh

      # 兩項排除各有理由,都記在票 54 的「CI 涵蓋落差」表裡。
      # **排除是已知代價,不是待補的洞** —— 表在票面上,不在這裡的註解裡。
      #
      #   --ignore   個人 pattern 那 4 個測試函式(12 個參數化案例)要讀使用者層
      #              的個人 pattern 清單,而那個檔的內容本身就是要防的東西,不上 CI。
      #              (此處刻意用描述式、不寫字面路徑 —— 寫了會被
      #               test_nothing_reaches_for_the_user_layer 擋下,而它擋得對。)
      #   --deselect 清單完整性那一條要 .dev/test-runs.jsonl 裡的排水證據,
      #              而證據格式是票 49 的題目。等票 49 定案後回來重評。
      - name: 跑測試
        run: |
          python -m pytest -q \
            --ignore=tests/test_known_items_regression.py \
            --deselect "tests/test_gate.py::TestLegacyNoRedlightList::test_the_list_is_what_the_generator_would_produce"

      # 票 85:CI 那一側的**收集清單**。只收集不執行 ——
      # 它的用途是拿去跟本機那一份取差集,不是再驗一次測試。
      #
      # **排在跑測試之後**,不是之前:排在之前的話,這一步紅就會讓
      # 跑測試那一步整個不執行,而票 85「條件二」寫死「不得讓原本會綠的那一步
      # 變紅或變綠」—— 從綠變成沒跑,也是變。
      #
      # **旗標必須與上一步相同**,否則兩份清單量的不是同一批,而
      # **差集照樣算得出來、照樣看起來合理**,沒有東西會說口徑不同。
      # 守它的是 tests/test_ci_workflow.py::
      # test_the_collect_only_step_selects_the_same_set_as_the_test_step ——
      # 它比的是**解析後的集合**,所以這裡的換行寫法可以與上一步不同,
      # 旗標的值不行。
      #
      # 清單怎麼回到人手上:`gh run view <run-id> --log`(裁決 2026-09-05,方案 C)。
      # 不走 upload-artifact —— 那解的是「本機沒有 gh」,而 gh 裝著也登入著;
      # 不進版控 —— 那要維護一份一千三百多行、每次增刪測試就過期的基準,
      # 而在還不知道差集長什麼樣之前,那是先付款後看貨。
      - name: 收集清單(票 85)
        run: |
          python -m pytest --collect-only -q \
            --ignore=tests/test_known_items_regression.py \
            --deselect "tests/test_gate.py::TestLegacyNoRedlightList::test_the_list_is_what_the_generator_would_produce"

      # 淨室:真的裝一次、讓每條規則各擋一次、再在新 repo 裡跑一次框架測試。
      #
      # **與上一步不重複。** 上一步驗的是**原始碼形態**(這個 repo 的樹),
      # 這一步驗的是**安裝後的形態**(裝出去的 repo)—— 同一份碼、兩個形態,
      # 而下游拿到的是後者。少了它,「換個環境也綠」完全沒有人在驗。
      #
      # **綠燈的範圍要照著票 54 的落差表讀**:這一步涵蓋的是
      # 13 / 93 個判定面的真實形態,不是全部。綠不代表其餘 80 面沒問題。
      #
      # 這個步驟本身由 tests/test_ci_workflow.py::test_verify_gates_is_wired_into_ci
      # 守著 —— 被拿掉會有東西叫。少了那條斷言,這裡就是
      # 「機制做好了但沒有東西保證它被走到」的第四個實例(票 56)。
      - name: 淨室驗證(每條規則各擋一次 + 安裝後形態)
        run: python .claude/portable/verify_gates.py "${{ runner.temp }}/verify-gates"
